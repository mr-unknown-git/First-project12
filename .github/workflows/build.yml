# filename=".github/workflows/build.yml"
name: Build TikTok View Bot APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer & Dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk zip unzip wget

      - name: Build APK
        run: |
          # 1. FORCE CLEAN: Delete the .buildozer folder to remove old failed installations
          rm -rf .buildozer

          # 2. Manually write the buildozer.spec file
          cat << 'EOF' > buildozer.spec
          [app]

          title = TikTok View Bot
          package.name = tiktokviewbot
          package.domain = org.tiktokviewbot
          source.dir = .

          source.include_exts = py,png,jpg,kv,atlas
          requirements = python3,kivy,httpx
          requirements.source = kivy

          version = 1.0

          orientation = portrait

          android.arch = arm64-v8a
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.build-tools = 33.0.0
          android.acceptlicenses = 1
          android.private_storage = True
          EOF

          # 3. Run the build
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTokViewBot-APK
          path: bin/*.apk
