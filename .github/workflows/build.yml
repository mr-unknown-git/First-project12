name: Build TikTok View Bot APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer & Dependencies
        run: |
          # Upgrade pip first
          pip install --upgrade pip
          # Install buildozer and cython
          pip install buildozer cython
          # Install Java 17 (Required for modern Android SDK)
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk zip unzip wget

      - name: Build APK
        run: |
          # We use --verbose to see exactly where it fails
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTokViewBot-APK
          path: bin/*.apk
