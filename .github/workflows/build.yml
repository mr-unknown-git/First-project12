# filename=".github/workflows/build.yml"
name: Build TikTok View Bot APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer & Dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk zip unzip wget

      - name: Build APK
        run: |
          # 1. Create the buildozer.spec file automatically
          buildozer init
          
          # 2. Fix the build-tools version manually in the spec file (Fixes Aidl error)
          sed -i 's/# android.build-tools/# android.build-tools/g' buildozer.spec
          sed -i 's/android.build-tools.*/android.build-tools = 33.0.0/' buildozer.spec
          
          # 3. Enable license auto-acceptance (Fixes License error)
          sed -i 's/# android.acceptlicenses/# android.acceptlicenses/g' buildozer.spec
          sed -i 's/android.acceptlicenses.*/android.acceptlicenses = 1/' buildozer.spec
          
          # 4. Update API and NDK to stable modern versions
          sed -i 's/android.api.*/android.api = 33/' buildozer.spec
          sed -i 's/android.ndk.*/android.ndk = 25b/' buildozer.spec
          
          # 5. Run the build
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTokViewBot-APK
          path: bin/*.apk
